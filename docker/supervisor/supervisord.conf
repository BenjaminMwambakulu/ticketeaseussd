[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx_stdout.log
stderr_logfile=/var/log/supervisor/nginx_stderr.log

[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/php-fpm_stdout.log
stderr_logfile=/var/log/supervisor/php-fpm_stderr.log

[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --queue=registrations,bookings --tries=3 --timeout=90
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/queue-worker_stdout.log
stderr_logfile=/var/log/supervisor/queue-worker_stderr.log
stopwaitsecs=3600
